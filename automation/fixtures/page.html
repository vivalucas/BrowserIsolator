<!doctype html><html><head><title>Automation fixture</title><style>button,input,select{margin:8px} #hidden{display:none} iframe{width:500px;height:170px} #long{height:5200px;background:linear-gradient(white,lightblue)}</style></head><body>
<h1>Test page</h1><label>Name <input id="name" placeholder="Name"></label><button id="load">Load async</button><div id="status">Idle</div><input id="check" type="checkbox"><select id="choice"><option value="a">A</option><option value="b">B</option></select><input id="file" type="file"><input id="readonly" readonly value="KEEP"><input id="number" type="number" value="123"><input id="date" type="date" value="2026-10-02"><button id="ariaDisabled" aria-disabled="true">Unavailable</button><fieldset disabled><input id="fieldsetInput" value="KEEP"></fieldset><button id="named" aria-label="Only named control">Named</button><button id="reveal" onclick="document.querySelector('#namedLater').hidden=false">Reveal</button><button id="namedLater" aria-label="Later named control" hidden>Later</button><div id="hidden">Hidden detail</div><button class="duplicate">One</button><button class="duplicate">Two</button><div id="shadow"></div><iframe src="/frame"></iframe><iframe id="cross" src="CROSS_ORIGIN/frame"></iframe><canvas id="canvas" width="80" height="50"></canvas><div id="long">Long page</div>
<script>
 document.querySelector('#load').onclick=()=>{document.querySelector('#status').textContent='Loading';console.log('fixture loading');setTimeout(async()=>{await fetch('/data');document.querySelector('#status').textContent='Loaded';},550)};
 const shadow=document.querySelector('#shadow').attachShadow({mode:'open'});shadow.innerHTML='<button id="shadowbutton">Shadow action</button><span id="shadowstatus">Waiting</span>';shadow.querySelector('button').onclick=()=>shadow.querySelector('span').textContent='Shadow done';
 const c=document.querySelector('#canvas').getContext('2d');c.fillStyle='red';c.fillRect(0,0,80,50);
</script></body></html>
