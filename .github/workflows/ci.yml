name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test compatibility contract
        working-directory: BrowserIsolator
        run: swift test
      - name: Build release executable
        working-directory: BrowserIsolator
        run: swift build -c release -Xswiftc -target -Xswiftc arm64-apple-macosx13.0
